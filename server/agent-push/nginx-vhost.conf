server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name ntfy.or-gm.com;
    ssl_certificate /var/lib/agent-push/nginx-tls/ntfy.or-gm.com.crt;
    ssl_certificate_key /var/lib/agent-push/nginx-tls/ntfy.or-gm.com.key;
    access_log off;

    if ($server_addr != 100.112.28.88) {
        return 404;
    }
    allow 100.64.0.0/10;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
