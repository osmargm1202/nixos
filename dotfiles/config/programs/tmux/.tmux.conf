# Baseline for users selecting tmux. Osmarg's existing complete preference
# remains in users/osmarg/common/.tmux.conf and overrides this layer.
set -g mouse on
set -g renumber-windows on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"

# Preserve modified-Enter sequences from Kitty and Zutty.
set -s extended-keys on
if-shell 'tmux show-options -s extended-keys-format >/dev/null 2>&1' 'set -s extended-keys-format xterm'
set -as terminal-features 'xterm*:extkeys'

# Home Manager generates this immutable plugin loader.
if-shell 'command -v tmux-agent-resume >/dev/null 2>&1' 'source-file ~/.config/tmux/persistence.conf'
# Codeman runs agents in its own tmux servers (-L codeman, -L codeman-remote).
# resurrect/continuum there would restore this user's sessions into them and
# respawn over the agent's pane, so those servers skip the plugins.
if -F '#{?#{m:*/codeman*,#{socket_path}},0,1}' 'source-file ~/.config/tmux/plugins.conf'
