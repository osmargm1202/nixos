# Exact conversation IDs are substituted into the resurrect snapshot.
set -g @resurrect-hook-post-save-layout 'tmux-agent-resume save'
# Agents are respawned after the restore instead of typed into a new shell:
# send-keys races ble.sh startup at boot and left commands unexecuted.
set -g @resurrect-processes 'false'
set -g @resurrect-hook-post-restore-all 'tmux-agent-resume restore "$_RESURRECT_DIR/last"'
set -g @resurrect-capture-pane-contents on
set -g @orgm-agent-auto-continue on
# systemd restores synchronously; normal manual tmux starts still use continuum.
if -F '#{==:#{@orgm-managed-restore},on}' 'set -g @continuum-restore off'
