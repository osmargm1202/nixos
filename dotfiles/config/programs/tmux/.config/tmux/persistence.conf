# Exact conversation IDs are substituted into the resurrect snapshot.
set -g @resurrect-hook-post-save-layout 'tmux-agent-resume save'
set -g @resurrect-processes 'tmux-agent-resume'
set -g @resurrect-capture-pane-contents on
set -g @orgm-agent-auto-continue on
# systemd restores synchronously; normal manual tmux starts still use continuum.
if -F '#{==:#{@orgm-managed-restore},on}' 'set -g @continuum-restore off'
