i3_main_menu_items() {
  printf '%s\n' \
    Apps Windows Terminal Firefox Files Obsidian Calculator Clipboard Symbols SSH Devices Profile Wallpaper Performance Help 'Edit config' Power
}

i3_main_menu_exec() {
  case "$1" in
    Firefox) exec firefox-open-tab --focus ;;
    Obsidian) exec i3-obsidian-open-or-focus ;;
    SSH) exec i3-ssh-host ;;
    Profile) exec orgm-visual-profile menu ;;
    Wallpaper) exec orgm-visual-profile random-wallpaper ;;
    'Edit config') exec i3-config-editor ;;
    *) return 1 ;;
  esac
}
