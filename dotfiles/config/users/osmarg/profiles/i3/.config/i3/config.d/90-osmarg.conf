# Personal i3 behavior retained for Osmarg only.
exec --no-startup-id syncthingtray --single-instance --wait
exec --no-startup-id sh -lc 'command -v discord >/dev/null 2>&1 && exec discord --start-minimized || true'
exec --no-startup-id sh -lc 'command -v steam >/dev/null 2>&1 && exec steam -silent || true'
exec --no-startup-id sh -lc '"$HOME/.local/bin/orgm-visual-profile" apply; dunstctl reload >/dev/null 2>&1 || exec dunst'
exec --no-startup-id systemctl --user --quiet start sunshine.service

set $status_command exec ~/.local/bin/i3status-personal

bindsym $mod+Shift+Tab exec --no-startup-id hypr-video-timer --backend i3
bindsym $mod+Escape exec --no-startup-id i3-firefox-tabs
bindsym $mod+d exec --no-startup-id $run i3-ssh-host
bindsym $mod+Mod1+w exec --no-startup-id $run orgm-visual-profile random-wallpaper
bindsym $mod+Ctrl+w exec --no-startup-id windows-rdp toggle
bindsym $mod+o exec --no-startup-id $run i3-obsidian-open-or-focus
bindsym $mod+Shift+p exec --no-startup-id $run i3-pi-prompt
bindsym $mod+a exec --no-startup-id kitty --class orgmai-chat -o remember_window_size=no -o initial_window_width=160c -o initial_window_height=42c -e orgmai new
bindsym $mod+Shift+a exec --no-startup-id kitty --class orgmai-config -o remember_window_size=no -o initial_window_width=132c -o initial_window_height=38c -e orgmai prev
bindsym $mod+Ctrl+Shift+a exec --no-startup-id kitty --class orgmai-config -o remember_window_size=no -o initial_window_width=132c -o initial_window_height=38c -e orgmai config
for_window [class="^orgmai-chat$"] floating enable, resize set width 85 ppt height 85 ppt, move position center
for_window [class="^orgmai-config$"] floating enable, resize set width 80 ppt height 80 ppt, move position center
