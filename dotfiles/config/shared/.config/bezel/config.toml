# Bezel trackpad edge gestures — Hyprland / caelestia
# Docs: https://github.com/Indra55/bezel

[zones]
left_width   = 0.08
right_width  = 0.08
top_height   = 0.08
bottom_height = 0.08

# ---- Left Zone: Volume ----
[gestures.left.up]
action = "command"
cmd = "volume-osd up"

[gestures.left.down]
action = "command"
cmd = "volume-osd down"

[gestures.left.tap]
action = "command"
cmd = "volume-osd mute"

# ---- Right Zone: Brightness ----
[gestures.right.up]
action = "command"
cmd = "brightness-osd up"

[gestures.right.down]
action = "command"
cmd = "brightness-osd down"

# ---- Top Zone: Workspaces ----
[gestures.top.right]
action = "command"
cmd = "hyprctl dispatch workspace e+1"

[gestures.top.left]
action = "command"
cmd = "hyprctl dispatch workspace e-1"

[gestures.top.tap]
action = "command"
cmd = "hyprctl dispatch global caelestia:dashboard"

# ---- Bottom Zone: Media + Launcher ----
[gestures.bottom.right]
action = "command"
cmd = "playerctl next"

[gestures.bottom.left]
action = "command"
cmd = "playerctl previous"

[gestures.bottom.tap]
action = "command"
cmd = "playerctl play-pause"

# ---- OSD ----
[osd]
enabled = true
backend = "notify-send"
canonical_hints = false
