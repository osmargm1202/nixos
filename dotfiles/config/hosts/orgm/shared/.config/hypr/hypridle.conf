general {
    lock_cmd = orgm-qylock lock
    on_lock_cmd = orgm-idle-clock hide
    before_sleep_cmd = orgm-qylock lock
    # Hold system sleep until Qylock reports the session as locked.
    inhibit_sleep = 3
    # Re-enable compositor DPMS after waking so Qylock can render.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}


listener {
    timeout = 180
    on-timeout = orgm-idle-clock show
    on-resume = orgm-idle-clock wake
}

# Caffeine inhibits locking and suspension, but not the clock. Keep this as a
# separate listener so every other inhibitor still controls the normal rule.
listener {
    timeout = 180
    ignore_inhibit = true
    on-timeout = orgm-idle-clock show-caffeine
    on-resume = orgm-idle-clock wake
}

listener {
    timeout = 600
    on-timeout = orgm-idle-clock lock || orgm-qylock lock
}

listener {
    timeout = 900
    on-timeout = orgm-idle-clock suspend
}
