general {
    lock_cmd = orgm-qylock lock
    before_sleep_cmd = orgm-qylock lock
    # Hold system sleep until Qylock reports the session as locked.
    inhibit_sleep = 3
    # Re-enable compositor DPMS after waking so Qylock can render.
    after_sleep_cmd = hyprctl dispatch dpms on
}


listener {
    timeout = 600
    on-timeout = orgm-qylock lock
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
