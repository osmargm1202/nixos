general {
    lock_cmd = pidof hyprlock || hypr-lock
    before_sleep_cmd = pidof hyprlock || hypr-lock
    # Hold system sleep until Hyprlock reports the session as locked.
    inhibit_sleep = 3
    # Re-enable compositor DPMS after waking so Hyprlock can render.
    after_sleep_cmd = hyprctl dispatch dpms on
}


listener {
    timeout = 600
    on-timeout = pidof hyprlock || hypr-lock
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
