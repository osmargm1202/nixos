# Start only the declared OSK service after this X11 session exported its display.
exec --no-startup-id sh -c 'systemctl --user import-environment DISPLAY XAUTHORITY; systemctl --user start orgm-osk.service'
bindsym $mod+Ctrl+o exec --no-startup-id orgm-osk toggle

# Rofi is a non-grabbing normal window for touchscreen/OSK interaction.
for_window [class="(?i)rofi"] floating enable, border pixel 0, move position center
