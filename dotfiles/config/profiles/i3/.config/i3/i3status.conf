general {
  output_format = "i3bar"
  colors = true
  interval = 1
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "tztime local"

wireless _first_ {
  format_up = "%ip"
  format_down = "down"
}

ethernet _first_ {
  format_up = "%speed"
  format_down = "down"
}

battery all {
  format = "%status %percentage"
}


tztime local {
  format = "%A %d - %B - %Y / %d-%m-%y | %-I:%M %p"
}
