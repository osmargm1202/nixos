[general]
monitor = pointer
background = rootpmap
blur_radius = 24
dim = 0.45
timeout = 30

[font]
icon_font = JetBrainsMono Nerd Font
label_font = sans-serif
icon_size = 78
label_size = 24
button_radius = 68
spacing = 98

[colors]
fg = #d8dee9
fg_active = #eceff4
bg = #2e3440
accent = #88c0d0

[button.logout]
label = Log out
icon = U+F2F5
key = e
command = i3-msg exit

[button.suspend]
label = Suspend
icon = U+F186
key = s
command = systemctl suspend

[button.reboot]
label = Reboot
icon = U+F021
key = r
command = systemctl reboot

[button.shutdown]
label = Power off
icon = U+F011
key = p
command = systemctl poweroff
