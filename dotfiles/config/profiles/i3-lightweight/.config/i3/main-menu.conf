i3_main_menu_items() {
  printf '%s\n' Apps Windows Terminal Firefox Files Calculator Clipboard Symbols Devices AI Steam ArtCraft Wallpaper Performance Help Power
}
i3_main_menu_exec() {
  case "$1" in
    Terminal) exec xterm ;;
    Firefox) exec firefox-open-tab --restore-or-focus ;;
    AI) exec xterm -e orgmai new ;;
    Steam) exec steam ;;
    ArtCraft) exec flatpak run ai.storyteller.artcraft-launcher ;;
    Power) exec i3-powermenu ;;
    *) return 1 ;;
  esac
}
