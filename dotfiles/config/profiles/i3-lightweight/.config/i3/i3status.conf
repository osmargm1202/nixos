general {
  output_format = "i3bar"
  colors = true
  interval = 5
}
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "volume master"
order += "cpu_usage"
order += "memory"
order += "disk /"
order += "tztime local"
wireless _first_ {
  format_up = "Wi-Fi %essid %quality"
  format_down = "Wi-Fi --"
  }
ethernet _first_ {
  format_up = "LAN %speed"
  format_down = ""
  }
battery all {
  format = "%status %percentage"
  last_full_capacity = true
  }
volume master {
  format = "Vol %volume"
  format_muted = "Mute"
  device = "pulse"
  }
cpu_usage {
  format = "CPU %usage"
  }
memory {
  format = "RAM %used/%total"
  threshold_degraded = "15%"
  format_degraded = "RAM %free libre"
  }
disk / {
  format = "SSD %avail"
  }
tztime local {
  format = "%d/%m %H:%M"
  }
