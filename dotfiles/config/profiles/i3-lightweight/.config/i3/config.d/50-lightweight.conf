# Shared low-memory variation; user-specific config.d entries override it.
# Terminal, status command and bar font use Xresources in lightweight.nix.
# i3 expands parent variables before reading includes; setting them here fails.
bindsym $mod+Escape exec --no-startup-id i3-firefox-tabs
exec --no-startup-id xsetroot -solid "#1a1b26"
exec --no-startup-id i3-wallpaper --restore
