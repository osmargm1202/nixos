# Native equivalents of Hyprland windows-workspaces.lua and Ryoku's base/user
# window rules. app_id is Wayland; class is XWayland. Never match browser tabs
# just because their title mentions a utility. Sizes use workspace percentages
# rather than fixed pixels, to fit smaller outputs without a resident helper.

# Files: approximately 1500x850 on a 1920x1080 output.
for_window [app_id="(?i)^(org\.gnome\.Nautilus|nautilus)$"] floating enable, resize set width 78 ppt height 78 ppt, move position center
for_window [class="(?i)^(org\.gnome\.Nautilus|nautilus)$"] floating enable, resize set width 78 ppt height 78 ppt, move position center

# Calculator variants used in Ryoku.
for_window [app_id="(?i)^(org\.gnome\.Calculator|qalculate-gtk|qalculate-qt)$"] floating enable, resize set width 22 ppt height 60 ppt, move position center
for_window [class="(?i)^(org\.gnome\.Calculator|qalculate-gtk|qalculate-qt)$"] floating enable, resize set width 22 ppt height 60 ppt, move position center

# Network, Bluetooth, audio and archive utilities.
for_window [app_id="^(pavucontrol|org\.pulseaudio\.pavucontrol|blueman-manager)$"] floating enable, resize set width 40 ppt height 48 ppt, move position center
for_window [class="^(Pavucontrol|pavucontrol|org\.pulseaudio\.pavucontrol|Blueman-manager|blueman-manager)$"] floating enable, resize set width 40 ppt height 48 ppt, move position center
for_window [app_id="^(bluetui|nmtui|nm-connection-editor|org\.gnome\.FileRoller|file-roller)$"] floating enable, resize set width 44 ppt height 52 ppt, move position center
for_window [class="(?i)^(bluetui|nmtui|nm-connection-editor|org\.gnome\.FileRoller|file-roller)$"] floating enable, resize set width 44 ppt height 52 ppt, move position center

# Personal AI windows: keep chat larger than configuration/history.
for_window [app_id="^orgmai-chat$"] floating enable, resize set width 71 ppt height 76 ppt, move position center
for_window [class="^orgmai-chat$"] floating enable, resize set width 71 ppt height 76 ppt, move position center
for_window [app_id="^orgmai-config$"] floating enable, resize set width 58 ppt height 69 ppt, move position center
for_window [class="^orgmai-config$"] floating enable, resize set width 58 ppt height 69 ppt, move position center

# Sync clients: placement only; this does not autostart any tray applet.
for_window [app_id="(?i)^(com\.nextcloud\.desktopclient\.nextcloud|nextcloud)$"] floating enable, move position center
for_window [class="(?i)^(com\.nextcloud\.desktopclient\.nextcloud|nextcloud)$"] floating enable, move position center
# Only the tray panel gets the compact size; preferences retain their own size.
for_window [app_id="(?i)^(com\.nextcloud\.desktopclient\.nextcloud|nextcloud)$" title="^Nextcloud$"] resize set width 30 ppt height 63 ppt, move position center
for_window [class="(?i)^(com\.nextcloud\.desktopclient\.nextcloud|nextcloud)$" title="^Nextcloud$"] resize set width 30 ppt height 63 ppt, move position center
# Native Syncthing Tray may supply an empty identity. Never match by title alone.
for_window [app_id="(?i)^(|com\.github\.martchus\.syncthingtray|syncthingtray)$" title="^Syncthing Tray$"] floating enable, resize set width 40 ppt height 56 ppt, move position center
for_window [class="(?i)^(|com\.github\.martchus\.syncthingtray|syncthingtray)$" title="^Syncthing Tray$"] floating enable, resize set width 40 ppt height 56 ppt, move position center

# Bitwarden extension popouts, including Firefox titles supplied after mapping.
# Ordinary browser tabs named Bitwarden must remain tiled.
for_window [app_id="(?i)^(firefox|org\.mozilla\.firefox)$" title="^(Extension:|Extensión:) \(Bitwarden Password Manager\) - "] floating enable, resize set width 25 ppt height 63 ppt, move position center, focus
for_window [class="(?i)^(firefox|org\.mozilla\.firefox)$" title="^(Extension:|Extensión:) \(Bitwarden Password Manager\) - "] floating enable, resize set width 25 ppt height 63 ppt, move position center, focus
for_window [app_id="^chrome-nngceckbapebfimnlniiiahkandclblb-.+$"] floating enable, resize set width 25 ppt height 63 ppt, move position center, focus
for_window [class="^chrome-nngceckbapebfimnlniiiahkandclblb-.+$"] floating enable, resize set width 25 ppt height 63 ppt, move position center, focus

# Screenshot editors and desktop settings are utility windows too.
for_window [app_id="(?i)^(swappy|satty|com\.gabm\.satty)$"] floating enable, resize set width 80 ppt height 80 ppt, move position center
for_window [class="(?i)^(swappy|satty|com\.gabm\.satty)$"] floating enable, resize set width 80 ppt height 80 ppt, move position center
for_window [app_id="^(nwg-displays|nwg-look|org\.gnome\.OnlineAccounts|gnome-online-accounts-gtk)$"] floating enable, resize set width 65 ppt height 75 ppt, move position center
for_window [class="(?i)^(nwg-displays|nwg-look|org\.gnome\.OnlineAccounts|gnome-online-accounts-gtk)$"] floating enable, resize set width 65 ppt height 75 ppt, move position center

# Music and small standalone tools, as in Ryoku. No programs are launched here.
for_window [app_id="(?i)^(spotify|ghosttype-app|ryotunes)$"] floating enable, move position center
for_window [class="(?i)^(spotify|ghosttype-app|ryotunes)$"] floating enable, move position center
for_window [app_id="^org\.quickshell$" title="^Ryotunes$"] floating enable, move position center
for_window [class="^org\.quickshell$" title="^Ryotunes$"] floating enable, move position center

# Virtual-machine viewers and SSH terminals.
for_window [app_id="^ryoport-ssh$"] floating enable, resize set width 47 ppt height 52 ppt, move position center
for_window [class="^ryoport-ssh$"] floating enable, resize set width 47 ppt height 52 ppt, move position center
for_window [app_id="^(spicy|looking-glass-client|[Qq]emu.*)$"] floating enable, resize set width 83 ppt height 83 ppt, move position center
for_window [class="^(Spicy|spicy|looking-glass-client|[Qq]emu.*)$"] floating enable, resize set width 83 ppt height 83 ppt, move position center
for_window [app_id="^windows-rdp$"] fullscreen enable
for_window [class="^windows-rdp$"] fullscreen enable
# A large normal window approximates Hyprland maximize without hiding Waybar.
for_window [title="^hardware-fastfetch$"] floating enable, resize set width 94 ppt height 90 ppt, move position center

# File pickers/authentication: xdg-shell transients float automatically in Sway.
# X11 needs explicit dialog/utility rules. Do not resize away client geometry.
for_window [window_type="dialog"] floating enable, move position center, opacity 1
for_window [window_type="utility"] floating enable, move position center, opacity 1
for_window [window_role="^(GtkFileChooserDialog|pop-up|task_dialog)$"] floating enable, move position center, opacity 1
for_window [title="^(Open File|Save File|Save As|Choose Files|Open Folder|Abrir archivo|Guardar archivo|Guardar como|Elegir archivos|Abrir carpeta)$"] floating enable, move position center, opacity 1
for_window [app_id="^(polkit-gnome-authentication-agent-1|org\.kde\.polkit-kde-authentication-agent-1|hyprpolkitagent|xdg-desktop-portal-gtk)$"] floating enable, move position center, opacity 1
for_window [class="^(Polkit-gnome-authentication-agent-1|polkit-gnome-authentication-agent-1|org\.kde\.polkit-kde-authentication-agent-1|hyprpolkitagent|Xdg-desktop-portal-gtk|xdg-desktop-portal-gtk)$"] floating enable, move position center, opacity 1

# Swaync handles desktop/web notifications on Wayland. Only X11 exposes a
# reliable notification type; title matches would float ordinary browser tabs.
for_window [class="(?i)^(firefox|org\.mozilla\.firefox|brave-browser|brave-origin|com\.brave\.Browser)$" window_type="notification"] floating enable, sticky enable
no_focus [class="(?i)^(firefox|org\.mozilla\.firefox|brave-browser|brave-origin|com\.brave\.Browser)$" window_type="notification"]
# Empty X11 drag surfaces must not steal keyboard focus.
no_focus [shell="xwayland" class="^$" title="^$" floating]

# Games: no glass or shadows, and no idle lock during visible fullscreen play.
# Tearing is intentionally not enabled globally on this hybrid-GPU machine.
for_window [app_id="^(steam|steam_app_.*|gamescope|EtG\.x86_64)$"] opacity 1, blur disable, shadows disable, inhibit_idle fullscreen
for_window [class="^(steam|steam_app_.*|gamescope|EtG\.x86_64)$"] opacity 1, blur disable, shadows disable, inhibit_idle fullscreen

# Browser/PWA windows tile by default, matching Hyprland's webapps-tiled rule.
# Do not force floating disable: their native modal/file dialogs must still float.
# Ryoku-only Hub/Store/Welcome windows, shader tags and scrolling column widths
# are not copied: they belong to that shell/compositor, not to Sway's layout.
# Chromium's sharing indicator remains visible (not hidden in a scratchpad).
