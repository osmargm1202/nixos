# Inspired by Catppuccin/swaylock and jirutka/swaylock-effects.
# Read by orgm-sway-lock; unsupported options are not passed to vanilla swaylock.
clock
indicator
timestr=%I:%M %p
datestr=%a, %d %b
effect-blur=7x5
effect-vignette=0.3:0.7
fade-in=0.2
grace=0
text-clear=Borrado
text-caps-lock=Mayúsculas
text-ver=Validando
text-wrong=Incorrecta
