# The 0d8c:0014 Mpow HC reports Mic steps 0..35 as -12..+23 dB.
# Keep hardware gain at or below 0 dB instead of boosting playback leakage.
[General]
priority = 87
description = Mpow microphone

[Element Mic]
required = volume
switch = mute
volume = merge
volume-limit = 12
override-map.1 = all

# This USB device exposes AGC as a playback switch even on its capture path.
[Element Auto Gain Control]
switch = off
direction = playback
