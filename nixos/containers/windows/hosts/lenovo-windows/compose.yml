# Lenovo T500 VFIO policy. Launch only with windows-vm: the adapter discovers
# the IOMMU group and supplies devices, the prepared image and the driver ISO.
# Both GPU modes share the same disk; the common supervisor serializes access.
services:
  windows:
    container_name: lenovo-windows
    environment:
      # Preserve the USB setup-media bus, replacing only the absolute tablet.
      USB: "yes"
      MOUSE: "virtio-mouse-pci"
      ARGUMENTS: >-
        -machine q35,kernel_irqchip=split
        -device intel-iommu,intremap=on,caching-mode=on,aw-bits=39
        -object memory-backend-file,id=looking-glass,mem-path=/dev/kvmfr0,size=134217728,share=on
        -device ivshmem-plain,memdev=looking-glass
        -device vfio-pci,host=01:00.0
        -spice port=5901,addr=0.0.0.0,disable-ticketing=on
        -audiodev spice,id=spice-audio
        -device ich9-intel-hda
        -device hda-duplex,audiodev=spice-audio
        -device virtio-keyboard-pci
    ports:
      - 127.0.0.1:5901:5901
    # Rootless Podman must retain the group owning the discovered VFIO devices.
    group_add:
      - keep-groups
